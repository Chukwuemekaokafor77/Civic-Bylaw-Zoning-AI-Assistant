[pytest]
# `python -m pytest` puts the working directory on sys.path; bare `pytest`
# does not. CI invokes the latter, so without this the whole suite fails
# collection with "No module named 'app'" while passing locally.
pythonpath = .

testpaths = tests

# Pinned rather than left to default: pytest-asyncio warns on every run
# that this will change in a future release, and an unpinned scope means
# the suite's behaviour depends on which version happens to be installed.
asyncio_default_fixture_loop_scope = function
